name: Devin remediation

on:
  workflow_run:
    workflows: [SonarCloud]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to remediate (empty = branch scan)
        required: false
        default: ''
      pr_branch:
        description: Head branch of that pull request (empty = branch scan)
        required: false
        default: ''

jobs:
  gate-owner:
    name: One Devin gate-owner session
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spawn gate-owner Devin session
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: HoltzTomas_sonarcloud-repsol-demo
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_PLAYBOOK_ID: PLAYBOOK_ID_GATE_OWNER
          DEVIN_TRIAGE_PLAYBOOK_ID: playbook-6a472415f95549de9af6f0e3545802ae
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || (github.event.workflow_run.pull_requests[0].number || '') }}
          PR_BRANCH: ${{ github.event.inputs.pr_branch || (github.event.workflow_run.head_branch || '') }}
          REMEDIATION_BRANCH: sonar/remediation
        run: python scripts/spawn_devin_sessions.py
